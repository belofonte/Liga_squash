<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    <title>Liga Squash Rafa vs JoseRa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background-color: #f3f4f6; overflow: hidden; }
        #root { height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        .scrollable-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const initialMatches = [
            { id: 1, date: "2026-09-22", winner: "Rafa", setsRafa: 4, setsJoseRa: 2, pointsRafa: 59, pointsJoseRa: 52 },
            { id: 2, date: "2026-09-29", winner: "Rafa", setsRafa: 4, setsJoseRa: 2, pointsRafa: 66, pointsJoseRa: 64 },
            { id: 3, date: "2026-10-01", winner: "Rafa", setsRafa: 4, setsJoseRa: 0, pointsRafa: 44, pointsJoseRa: 32 },
            { id: 4, date: "2026-10-06", winner: "Rafa", setsRafa: 4, setsJoseRa: 0, pointsRafa: 44, pointsJoseRa: 26 },
            { id: 5, date: "2026-10-08", winner: "JoseRa", setsRafa: 2, setsJoseRa: 4, pointsRafa: 55, pointsJoseRa: 59 },
            { id: 6, date: "2026-10-13", winner: "Rafa", setsRafa: 4, setsJoseRa: 1, pointsRafa: 52, pointsJoseRa: 40 },
            { id: 7, date: "2026-10-20", winner: "JoseRa", setsRafa: 1, setsJoseRa: 4, pointsRafa: 46, pointsJoseRa: 51 },
            { id: 8, date: "2026-10-22", winner: "Rafa", setsRafa: 4, setsJoseRa: 2, pointsRafa: 59, pointsJoseRa: 53 },
            { id: 9, date: "2026-10-27", winner: "Rafa", setsRafa: 4, setsJoseRa: 2, pointsRafa: 58, pointsJoseRa: 46 }
        ].reverse();

        function App() {
            const [matches, setMatches] = useState(initialMatches);
            const [activeTab, setActiveTab] = useState('dashboard');

            const stats = useMemo(() => {
                let ptsRafa = 0, ptsJoseRa = 0;
                let totalSetsRafa = 0, totalSetsJoseRa = 0;

                matches.forEach(m => {
                    if (m.setsRafa === 4) ptsRafa += 1;
                    if (m.setsJoseRa === 4) ptsJoseRa += 1;
                    totalSetsRafa += m.setsRafa;
                    totalSetsJoseRa += m.setsJoseRa;
                });

                return { ptsRafa, ptsJoseRa, totalSetsRafa, totalSetsJoseRa, totalMatches: matches.length };
            }, [matches]);

            return (
                <div className="flex flex-col h-full bg-gray-100">
                    <div className="bg-blue-600 text-white p-4 text-center font-bold text-xl shadow-md z-10">
                        Liga Squash 2026
                    </div>
                    
                    <div className="scrollable-content p-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-xl shadow">
                                    <h2 className="text-lg font-bold mb-4 text-gray-700 border-b pb-2">Clasificación General</h2>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-xl font-bold text-blue-600">Rafa</span>
                                        <span className="text-2xl font-black">{stats.ptsRafa} pts</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-xl font-bold text-green-600">JoseRa</span>
                                        <span className="text-2xl font-black">{stats.ptsJoseRa} pts</span>
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-xl shadow">
                                    <h2 className="text-lg font-bold mb-4 text-gray-700 border-b pb-2">Sets Acumulados (Desempate)</h2>
                                    <div className="flex justify-between text-gray-600">
                                        <span>Rafa: <b>{stats.totalSetsRafa}</b> sets</span>
                                        <span>JoseRa: <b>{stats.totalSetsJoseRa}</b> sets</span>
                                    </div>
                                </div>
                                
                                <div className="bg-white p-4 rounded-xl shadow">
                                    <p className="text-center text-sm text-gray-500">Partidos disputados: {stats.totalMatches}</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'history' && (
                            <div className="space-y-3">
                                <h2 className="font-bold text-gray-700 mb-2">Historial de Partidos</h2>
                                {matches.map(m => (
                                    <div key={m.id} className="bg-white p-3 rounded-lg shadow-sm border-l-4 border-blue-500">
                                        <div className="flex justify-between text-xs text-gray-400 mb-1">
                                            <span>Partido #{m.id}</span>
                                            <span>{m.date}</span>
                                        </div>
                                        <div className="flex justify-between font-bold">
                                            <span className={m.winner === 'Rafa' ? 'text-blue-600' : 'text-gray-600'}>Rafa: {m.setsRafa}</span>
                                            <span className="text-gray-300">vs</span>
                                            <span className={m.winner === 'JoseRa' ? 'text-green-600' : 'text-gray-600'}>JoseRa: {m.setsJoseRa}</span>
                                        </div>
                                        <div className="text-xs text-center mt-2 text-gray-500 bg-gray-50 rounded p-1">
                                            Tanteo global: {m.pointsRafa} - {m.pointsJoseRa}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-3 pb-safe z-20">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-2 ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-gray-400'}`}>
                            <span className="font-bold">Estadísticas</span>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center p-2 ${activeTab === 'history' ? 'text-blue-600' : 'text-gray-400'}`}>
                            <span className="font-bold">Historial</span>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
